<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Настройки - Система заявок на ремонт лифтов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="icon" href="data:,">
    <style>
        body { background-color: #0f1419; color: #fff; }
        .navbar { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%) !important; }
        .settings-card { background: #1c2833; border: 1px solid #2d3f50; border-radius: 12px; padding: 30px; max-width: 600px; margin: 0 auto; }
        .form-switch .form-check-input { width: 3rem; height: 1.5rem; cursor: pointer; }
        .form-switch .form-check-label { cursor: pointer; font-size: 1.1rem; }
        .setting-item { padding: 15px 0; border-bottom: 1px solid #2d3f50; }
        .setting-item:last-child { border-bottom: none; }
        .setting-desc { color: #8b949e; font-size: 0.9rem; margin-top: 5px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-tools"></i>
                <span>Система заявок на ремонт лифтов</span>
            </a>
            <a href="/" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> На главную
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="settings-card">
            <h3 class="mb-4"><i class="bi bi-gear me-2"></i>Настройки уведомлений</h3>
            
            <div class="setting-item">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="notify_linear" checked>
                    <label class="form-check-label" for="notify_linear">
                        <strong>📱 Линейный механик</strong>
                    </label>
                </div>
                <div class="setting-desc">
                    Отправлять заявки закреплённому за лифтом механику в рабочее время (08:00-17:00, пн-пт)
                </div>
            </div>
            
            <div class="setting-item">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="notify_oncall" checked>
                    <label class="form-check-label" for="notify_oncall">
                        <strong>🚨 Аварийный механик</strong>
                    </label>
                </div>
                <div class="setting-desc">
                    Отправлять заявки дежурному аварийному механику (кроме низкого приоритета)
                </div>
            </div>
            
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary" onclick="saveSettings()">
                    <i class="bi bi-check-lg me-1"></i>Сохранить
                </button>
                <button class="btn btn-outline-secondary" onclick="loadSettings()">
                    <i class="bi bi-arrow-clockwise me-1"></i>Сбросить
                </button>
            </div>
            
            <div id="saveResult" class="mt-3"></div>
        </div>
    </div>

    <script>
        async function loadSettings() {
            try {
                const resp = await fetch('/api/settings');
                const settings = await resp.json();
                
                document.getElementById('notify_linear').checked = settings.notification_linear !== 'false';
                document.getElementById('notify_oncall').checked = settings.notification_oncall !== 'false';
            } catch (e) {
                console.error('Ошибка загрузки:', e);
            }
        }
        
        async function saveSettings() {
            const data = {
                notification_linear: document.getElementById('notify_linear').checked,
                notification_oncall: document.getElementById('notify_oncall').checked
            };
            
            try {
                const resp = await fetch('/api/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await resp.json();
                
                const resultDiv = document.getElementById('saveResult');
                if (result.success) {
                    resultDiv.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle"></i> Настройки сохранены!</div>';
                } else {
                    resultDiv.innerHTML = '<div class="alert alert-danger"><i class="bi bi-x-circle"></i> Ошибка сохранения</div>';
                }
                setTimeout(() => resultDiv.innerHTML = '', 3000);
            } catch (e) {
                console.error('Ошибка:', e);
            }
        }
        
        loadSettings();
    </script>
</body>
</html>
