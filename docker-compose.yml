version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lift_repair
      POSTGRES_USER: liftuser
      POSTGRES_PASSWORD: liftpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftuser -d lift_repair"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://liftuser:liftpass123@postgres:5432/lift_repair
      - MAX_BOT_TOKEN=f9LHodD0cOJr6-3caEEtEU-KqU42RaPXLpz3wkHbJMQc0vANY8fVYJfXn0bsZh7IdSq0sNqBkyGwfySDPS8l
      - LM_STUDIO_URL=http://host.docker.internal:1234
    volumes:
      - ./uploads:/app/uploads
      - ./instance:/app/instance

volumes:
  postgres_data: